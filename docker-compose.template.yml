services:
    mirotalkadmin:
        image: mirotalk/admin:latest
        container_name: mirotalkadmin
        hostname: mirotalkadmin
        restart: unless-stopped
        ports:
            - '${ADMIN_PORT}:${ADMIN_PORT}'
        volumes:
            - ./frontend:/app/frontend:ro
            - ./backend:/app/backend:ro
            - ./.env:/app/.env:ro
            #- ~/.ssh/id_rsa:/app/id_rsa:ro
            # For APP_MANAGE_MODE=docker: expose the host Docker socket so the
            # bundled Docker CLI can manage sibling MiroTalk containers.
            #- /var/run/docker.sock:/var/run/docker.sock
