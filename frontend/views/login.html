<div id="login">
    <div class="login-card">
        <div class="login-header">
            <img class="login-logo" src="assets/favicon/android-chrome-192x192.png" alt="" width="56" height="56" />
            <h1>MiroTalk Admin</h1>
            <p>Sign in to manage your MiroTalk instances</p>
        </div>
        <form id="login-form" class="login-body" novalidate>
            <div class="mb-3">
                <label for="user" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
                    <input
                        id="user"
                        type="text"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        autofocus
                    />
                </div>
            </div>
            <div class="mb-4">
                <label for="pass" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
                    <input
                        id="pass"
                        type="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        aria-describedby="caps-lock-status"
                    />
                    <button
                        id="password-toggle-btn"
                        class="btn btn-outline-secondary password-toggle-btn"
                        type="button"
                        title="Show password"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="caps-lock-status" class="caps-lock-status hidden" role="status">
                    <i class="fas fa-triangle-exclamation"></i> Caps Lock is on
                </div>
            </div>
            <button id="login-btn" type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt"></i> Sign in
            </button>
        </form>
        <div class="login-footer">Version 1.1.41</div>
    </div>
</div>
